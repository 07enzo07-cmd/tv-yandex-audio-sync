# VOX webOS -> Yandex Station Mini 2 Audio Sync v3.0 Config
# Proportional curve: TV=12 -> 80% (level 8), TV=15+ -> 100%, no cap at 6
vol_slope = 6.6666667
vol_cap = 100
vol_gamma = 1.0

# TV Speaker Delay actuator (disabled by default on VOX per Phase 0.3 pre-tap findings)
tv_delay_enabled = false
tv_delay_max_ms = 50
