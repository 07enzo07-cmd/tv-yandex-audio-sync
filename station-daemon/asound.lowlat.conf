pcm.!default {
  type asym

  playback.pcm {
    type softvol
    slave.pcm "dmix_spk_plug"

    control {
      name "Master Playback Volume"
    }
  }

  capture.pcm {
    type multi
    slaves.a.pcm "hw:0,1" # mics
    slaves.a.channels 8
    slaves.b.pcm "hw:0,0" # loopback
    slaves.b.channels 2
    bindings.0.slave a
    bindings.0.channel 0
    bindings.1.slave a
    bindings.1.channel 2
    bindings.2.slave a
    bindings.2.channel 4
    bindings.3.slave a
    bindings.3.channel 6
    bindings.4.slave b
    bindings.4.channel 0
    bindings.5.slave b
    bindings.5.channel 1
  }
}

pcm.dmix_spk_plug {
  type plug
  slave.pcm "dmix_spk"
}

pcm.dmix_spk {
  type dmix
  ipc_key 1024
  ipc_key_add_uid false
  ipc_perm 0666
  slave.pcm "hw:0,0"
  slave.channels 2
  slave.buffer_size 1920
  slave.period_size 480
}
